name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Mostra errori di compilazione
        if: failure()
        run: |
          {
            echo "## Causa dell'errore"
            echo '~~~'
            if grep -q "What went wrong" build.log; then
              sed -n '/What went wrong/,/^\* Try/p' build.log | head -60
            else
              echo "Sezione 'What went wrong' non trovata nel log."
            fi
            echo '~~~'
            echo ""
            echo "## Righe di errore riconosciute"
            echo '~~~'
            grep -E -i "^e: |error:|ERROR|Could not (resolve|find)|Manifest merger failed|Execution failed for task|Unresolved reference|Duplicate class" build.log \
              | sort -u | head -50 || echo "Nessuna riga riconosciuta."
            echo '~~~'
            echo ""
            echo "## Ultime righe del log"
            echo '~~~'
            tail -60 build.log
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             out/WattMeter-v1.0.${{ github.run_number }}.apk
          if [ -f wear/build/outputs/apk/release/wear-release.apk ]; then
            cp wear/build/outputs/apk/release/wear-release.apk \
               out/WattMeter-Watch-v1.0.${{ github.run_number }}.apk
          else
            echo "::warning::APK dell'orologio non trovato, pubblico solo quello del telefono"
          fi
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WattMeter-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: WattMeter v1.0.${{ github.run_number }}
          body: |
            Build automatica dal commit ${{ github.sha }}.
            Due APK qui sotto: uno per il telefono, uno per il Galaxy Watch
            (installalo sull'orologio via ADB o il tuo metodo abituale).
          files: out/*.apk
          draft: false
          prerelease: false
